name: Merge claude/* branches into main

# ルーティン（自動実行セッション）は既定で claude/ 始まりのブランチにしかpushできない
# （main への直接pushはAnthropic側の既知の制限）ため、claude/* への push を検知して
# main へ自動マージする。GITHUB_TOKEN でのpushは他のワークフローの push トリガーを
# 起動しないため、deploy.yml 側は workflow_run でこのワークフローの完了を購読する。

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: merge-claude-branches
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-ff "origin/${BRANCH}" -m "Merge ${BRANCH} into main (auto)"
          git push origin main

      - name: Delete merged branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "${BRANCH}"
