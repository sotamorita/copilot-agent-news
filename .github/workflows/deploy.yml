name: Build and deploy site

# main への通常pushに加えて、merge-claude-branches.yml の完了（= ルーティンが作った
# claude/* ブランチがmainへ自動マージされたとき）でも起動する。GITHUB_TOKENによる
# pushは他ワークフローの push トリガーを起動しないため、workflow_run で購読する。
on:
  push:
    branches: [main]
    paths:
      - 'news/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Merge claude/* branches into main']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、後続を待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --strict は語彙にない data-tags があると非ゼロ終了する。
      # 公開自体は止めたくないので警告扱いにし、Actions のログで気付けるようにする。
      - name: Build site
        run: node site/build.mjs --strict
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
